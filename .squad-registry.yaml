# ============================================================================
# Integration Metadata
# ============================================================================

integration_rules:
  namespace_prefix: true
  description: "All squad agents must be prefixed with squad name (e.g., apex-lead, dispatch-orchestrator)"

  routing:
    description: "Agent routing defined in .claude/rules/squad-integration.md"
    primary_router: "@architect"
    fallback_router: "@aiox-master"

  conflict_resolution:
    strategy: "priority-based"
    priority_field: "priority (P0 > P1 > P2)"
    mediator: "@aiox-master"

timeline:
  phase1_p0: "2026-05-01 to 2026-05-08 (Apex, Dispatch, Squad-Creator)"
  phase2_p1: "2026-05-08 to 2026-05-15 (Brand, Deep-Research, SEO)"
  phase3_p2: "2026-05-15 to 2026-05-22 (Kaizen, Curator, Legal, Education)"
  phase4_p3: "2026-05-22+ (Kaizen-V2, Squad-Creator-Pro)"

monitoring:
  dashboard: "docs/squads/integration-dashboard.md"
  health_check: "aiox kaizen analyze"
  conflict_detection: "aiox ids health"
